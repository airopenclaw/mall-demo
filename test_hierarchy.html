<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>层级结构测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .hierarchy-test {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>📊 层级缩进结构测试</h2>
        <div class="hierarchy-test">
            <!-- 模拟版本 -->
            <div class="version-header" style="padding: 12px 16px; background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%); border-left: 4px solid #667eea; position: relative;">
                <span style="margin-left: 4px;">🎯</span>
                <span style="font-weight: 700;">V1.0 - 基础版</span>
                <span style="font-size: 12px; color: #888; margin-left: 8px;">店铺后台与订单支付基础功能</span>
                <span style="font-size: 11px; color: #999; background: rgba(0,0,0,0.06); padding: 2px 8px; border-radius: 10px; margin-left: auto;">2</span>
            </div>
            
            <!-- 模拟分类 -->
            <div class="category-header" style="padding: 10px 16px 10px 44px; background: #fafbfc; position: relative; border-left: 3px solid transparent;">
                <span style="position: absolute; left: 17px; width: 8px; height: 8px; border-radius: 50%; background: #667eea; border: 2px solid #fff; box-shadow: 0 0 0 1px #e0e0e0;"></span>
                <span>🏪</span>
                <span style="font-weight: 600;">店铺后台</span>
                <span style="font-size: 11px; color: #bbb; background: #f0f0f0; padding: 2px 6px; border-radius: 8px; margin-left: auto;">9</span>
            </div>
            
            <!-- 模拟页面 -->
            <div class="page-item" style="padding: 10px 16px 10px 56px; position: relative;">
                <span style="position: absolute; left: 26px; width: 6px; height: 6px; border-radius: 50%; background: #999; border: 2px solid #fff; box-shadow: 0 0 0 1px #e0e0e0;"></span>
                <span style="font-size: 16px; opacity: 0.7;">📊</span>
                <span>数据概览</span>
            </div>
            
            <div class="page-item" style="padding: 10px 16px 10px 56px; position: relative; background: #f0f4ff;">
                <span style="position: absolute; left: 25px; width: 8px; height: 8px; border-radius: 50%; background: #667eea; border: 2px solid #fff; box-shadow: 0 0 0 2px #667eea;"></span>
                <span style="font-size: 16px; opacity: 0.7;">⚙️</span>
                <span style="color: #667eea; font-weight: 600;">基本设置</span>
            </div>
        </div>
        
        <div style="margin-top: 20px; padding: 16px; background: #f9f9f9; border-radius: 4px;">
            <h3 style="margin-top: 0; color: #667eea;">层级说明：</h3>
            <ul style="line-height: 2;">
                <li><strong>版本（V1.0）</strong>: 左边距 16px，左边框 4px</li>
                <li><strong>分类（店铺后台）</strong>: 左边距 44px，连接线 + 连接点</li>
                <li><strong>页面（数据概览）</strong>: 左边距 56px，连接线 + 连接点</li>
            </ul>
        </div>
    </div>
</body>
</html>
