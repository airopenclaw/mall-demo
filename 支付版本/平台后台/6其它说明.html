<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需其它说明</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.8;
            color: #333;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 页面标题 */
        .page-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }

        /* 内容卡片 */
        .content-card {
            background: white;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
        }

        /* 需求列表 */
        .requirement-list {
            list-style: none;
            padding: 0;
        }

        .requirement-list li {
            padding: 15px 20px;
            margin-bottom: 12px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            color: #606266;
            line-height: 1.8;
        }

        .requirement-list li:before {
            content: "✓ ";
            color: #67c23a;
            font-weight: 600;
            margin-right: 8px;
        }

        /* 响应式 */
        @media screen and (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .page-title {
                font-size: 24px;
            }

            .content-card {
                padding: 25px 20px;
            }

            .section-title {
                font-size: 18px;
            }

            .requirement-list li {
                padding: 12px 15px;
                font-size: 13px;
            }
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
            }

            .content-card {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">其它说明</h1>

        <div class="content-card">
            <h2 class="section-title">原有功能的兼容</h2>

            <ul class="requirement-list">
                <li>需在平台后台、店铺后台的订单列表、详情中的支付方式名称显示正确。订单列表中的智付方式可选值需能选择正确


</li>
                <li>客户详情中的支付方式配置不需要显示分账体系的支付方式，默认每个用户都有分账体系的支付方式权限
</li>
                <li>分账体系的订单不用进原有财务模块的“资金流水”列表。只有自营店铺的支付才进这个列表</li>
                
            </ul>
        </div>

        <div style="text-align: center; padding: 30px 0; color: #999; font-size: 13px;">
            <p>© 2025 万商优选 | 支付分账系统</p>
        </div>
    </div>
</body>
</html>
