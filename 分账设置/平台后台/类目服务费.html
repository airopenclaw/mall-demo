<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类目服务费</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            color: #333;
            background: #f5f5f5;
            line-height: 1.6;
        }

        /* 顶部菜单栏 */
        .top-menu {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            height: 50px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .top-menu-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            padding: 0 20px;
            border-right: 1px solid #e0e0e0;
            margin-right: 0;
            white-space: nowrap;
            width: 187px;
            flex-shrink: 0;
        }

        .top-menu-left {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .top-menu-item {
            padding: 0 15px;
            height: 50px;
            line-height: 50px;
            cursor: default;
            color: #666;
            position: relative;
            white-space: nowrap;
        }

        .top-menu-item:hover {
            color: #333;
        }

        .top-menu-item.active {
            color: #667eea;
            font-weight: 600;
        }

        .top-menu-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        .top-menu-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .btn-text {
            background: transparent;
            border: 1px solid #667eea;
            color: #667eea;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-text:hover {
            background: #667eea;
            color: #fff;
        }

        /* 主体布局 */
        .main-container {
            display: flex;
            margin-top: 50px;
            min-height: calc(100vh - 50px);
        }

        /* 左侧菜单 */
        .left-sidebar {
            width: 187px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .menu-level-1 {
            margin-bottom: 5px;
        }

        .menu-level-1-header {
            padding: 10px 20px;
            cursor: default;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-level-1-header::after {
            content: '▼';
            font-size: 10px;
            color: #999;
        }

        .menu-level-2 {
            padding-left: 0;
        }

        .menu-level-2-item {
            padding: 8px 20px 8px 40px;
            cursor: default;
            color: #666;
        }

        .menu-level-2-item:hover {
            color: #333;
            background: #f5f5f5;
        }

        .menu-level-2-item.active {
            color: #667eea;
            background: #f0f4ff;
            font-weight: 500;
        }

        /* 右侧内容区 */
        .content-area {
            flex: 1;
            background: #f0f2f5;
            padding: 20px;
            overflow-y: auto;
        }

        /* 卡片样式 */
        .card {
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }

        .card-header {
            padding: 14px 20px;
            border-bottom: 1px solid #ebeef5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
        }

        .card-body {
            padding: 0;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 0;
            padding: 0 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #fafafa;
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #606266;
            border-bottom: 1px solid #e4e7ed;
            white-space: nowrap;
        }

        td {
            padding: 11px 16px;
            border-bottom: 1px solid #ebeef5;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            background: #207FE9;
            color: #fff;
        }

        .btn-link {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部菜单栏 -->
    <div class="top-menu">
        <div class="top-menu-title">平台后台</div>
        <div class="top-menu-item">运营</div>
        <div class="top-menu-item">商品</div>
        <div class="top-menu-item">订单</div>
        <div class="top-menu-item">客户</div>
        <div class="top-menu-item">plus客户</div>
        <div class="top-menu-item">营销</div>
        <div class="top-menu-item">装修</div>
        <div class="top-menu-item">店铺</div>
        <div class="top-menu-item">财务</div>
        <div class="top-menu-item">风控</div>
        <div class="top-menu-item active">入驻</div>
        <div class="top-menu-item">设置</div>
    </div>

    <!-- 主体容器 -->
    <div class="main-container">
        <!-- 左侧菜单 -->
        <div class="left-sidebar">
            <div class="menu-level-1">
                <div class="menu-level-1-header">分账设置</div>
                <div class="menu-level-2">
                    <div class="menu-level-2-item">支付机构</div>
                    <div class="menu-level-2-item">分账规则</div>
                    <div class="menu-level-2-item active">类目服务费</div>
                </div>
            </div>
        </div>

        <!-- 右侧内容区 -->
        <div class="content-area">
            <!-- 类目服务费卡片 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">类目服务费</div>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>类目编码</th>
                                    <th>类目名称</th>
                                    <th>费率%</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>CAT001</td>
                                    <td>大家电</td>
                                    <td>6%</td>
                                    <td><a class="btn-link">修改</a></td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td>CAT002</td>
                                    <td>小家电</td>
                                    <td>5%</td>
                                    <td><a class="btn-link">修改</a></td>
                                </tr>
                                <tr>
                                    <td>3</td>
                                    <td>CAT003</td>
                                    <td>手机数码</td>
                                    <td>4%</td>
                                    <td><a class="btn-link">修改</a></td>
                                </tr>
                                <tr>
                                    <td>4</td>
                                    <td>CAT004</td>
                                    <td>服装服饰</td>
                                    <td>3%</td>
                                    <td><a class="btn-link">修改</a></td>
                                </tr>
                                <tr>
                                    <td>5</td>
                                    <td>CAT005</td>
                                    <td>食品饮料</td>
                                    <td>2%</td>
                                    <td><a class="btn-link">修改</a></td>
                                </tr>
                                <tr>
                                    <td>6</td>
                                    <td>CAT006</td>
                                    <td>家居家装</td>
                                    <td>0%</td>
                                    <td><a class="btn-link">修改</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
