<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基本设置 - 店铺后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'PingFang SC','Helvetica Neue',Arial,sans-serif; font-size: 14px; color: #303133; background: #f0f2f5; }
.page { padding: 20px; }
.page-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.card { background: #fff; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); margin-bottom: 16px; }
.card-header { padding: 14px 20px; border-bottom: 1px solid #ebeef5; font-size: 15px; font-weight: 600; }
.card-body { padding: 20px; }
.info-row { display: flex; padding: 10px 0; border-bottom: 1px solid #ebeef5; font-size: 13px; }
.info-row:last-child { border-bottom: none; }
.info-label { width: 120px; color: #606266; text-align: right; padding-right: 16px; flex-shrink: 0; }
.info-value { flex: 1; color: #303133; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
.tag-success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px; border: 1px solid transparent; border-radius: 4px; font-size: 13px; cursor: pointer; background: #207FE9; color: #fff; margin-top: 20px; }
.btn-default { background: #fff; color: #606266; border-color: #e4e7ed; margin-left: 10px; }
</style>
</head>
<body>
<div class="page">
  <div class="page-title">基本设置</div>
  <div class="card">
    <div class="card-header">系统配置</div>
    <div class="card-body">
      <div class="info-row"><div class="info-label">系统名称</div><div class="info-value">家电S2B2B支付分账系统</div></div>
      <div class="info-row"><div class="info-label">商户名称</div><div class="info-value">XX家电供应链管理有限公司</div></div>
      <div class="info-row"><div class="info-label">商户编号</div><div class="info-value">MCH202401010001</div></div>
      <div class="info-row"><div class="info-label">结算周期</div><div class="info-value">T+1（每日结算）</div></div>
      <div class="info-row"><div class="info-label">最小分账金额</div><div class="info-value">¥0.01</div></div>
      <div class="info-row"><div class="info-label">系统通知</div><div class="info-value"><span class="tag tag-success">开启</span> 邮件 + 站内信</div></div>
      <div class="info-row"><div class="info-label">自动对账</div><div class="info-value"><span class="tag tag-success">开启</span> 每日 02:00 自动执行</div></div>
      <button class="btn">保存设置</button><button class="btn btn-default">取消</button>
    </div>
  </div>
</div>
</body>
</html>
