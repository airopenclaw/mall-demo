<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色管理 - 店铺后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'PingFang SC','Helvetica Neue',Arial,sans-serif; font-size: 14px; color: #303133; background: #f0f2f5; }
.page { padding: 20px; }
.page-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.card { background: #fff; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); margin-bottom: 16px; }
.card-header { padding: 14px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
.card-title { font-size: 15px; font-weight: 600; }
.card-body { padding: 20px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: #fafafa; }
thead th { padding: 12px 16px; text-align: left; font-weight: 600; color: #606266; border-bottom: 1px solid #e4e7ed; }
tbody td { padding: 11px 16px; border-bottom: 1px solid #ebeef5; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
.tag-success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px; border: 1px solid transparent; border-radius: 4px; font-size: 13px; cursor: pointer; background: #207FE9; color: #fff; }
.pagination { display: flex; align-items: center; justify-content: flex-end; padding: 14px 20px; gap: 6px; font-size: 13px; color: #606266; }
.page-btn { min-width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 1px solid #e4e7ed; border-radius: 4px; background: #fff; }
.page-btn.active { background: #207FE9; color: #fff; }
.page-btn.disabled { opacity: 0.4; }
</style>
</head>
<body>
<div class="page">
  <div class="page-title">角色管理</div>
  <div class="card">
    <div class="card-header"><div class="card-title">角色列表</div><button class="btn">+ 添加角色</button></div>
    <div class="card-body table-wrap">
      <table>
        <thead><tr><th>角色ID</th><th>角色名称</th><th>角色标识</th><th>用户数</th><th>权限范围</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
          <tr><td>R001</td><td>超级管理员</td><td>super_admin</td><td>1</td><td>全部权限</td><td><span class="tag tag-success">启用</span></td><td><a href="#">编辑</a></td></tr>
          <tr><td>R002</td><td>店铺管理员</td><td>shop_admin</td><td>12</td><td>店铺管理、商品管理、订单管理</td><td><span class="tag tag-success">启用</span></td><td><a href="#">编辑</a></td></tr>
          <tr><td>R003</td><td>财务人员</td><td>finance</td><td>8</td><td>分账查看、支付记录、对账</td><td><span class="tag tag-success">启用</span></td><td><a href="#">编辑</a></td></tr>
          <tr><td>R004</td><td>运营人员</td><td>operator</td><td>15</td><td>商品管理、订单查看</td><td><span class="tag tag-success">启用</span></td><td><a href="#">编辑</a></td></tr>
          <tr><td>R005</td><td>客服人员</td><td>customer_service</td><td>23</td><td>订单查看、退款处理</td><td><span class="tag tag-success">启用</span></td><td><a href="#">编辑</a></td></tr>
        </tbody>
      </table>
      <div class="pagination"><span>共 5 条</span><span class="page-btn disabled">&lt;</span><span class="page-btn active">1</span><span class="page-btn disabled">&gt;</span></div>
    </div>
  </div>
</div>
</body>
</html>
