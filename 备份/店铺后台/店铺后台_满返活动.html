<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满返活动 - 店铺后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'PingFang SC','Helvetica Neue',Arial,sans-serif; font-size: 14px; color: #303133; background: #f0f2f5; }
.page { padding: 20px; }
.page-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.card { background: #fff; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); margin-bottom: 16px; }
.card-body { padding: 20px; }
.search-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
.search-bar input, .search-bar select { height: 32px; border: 1px solid #e4e7ed; border-radius: 4px; padding: 0 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px; border: 1px solid transparent; border-radius: 4px; font-size: 13px; cursor: pointer; background: #207FE9; color: #fff; }
.btn-default { background: #fff; color: #606266; border-color: #e4e7ed; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: #fafafa; }
thead th { padding: 12px 16px; text-align: left; font-weight: 600; color: #606266; border-bottom: 1px solid #e4e7ed; }
tbody td { padding: 11px 16px; border-bottom: 1px solid #ebeef5; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
.tag-success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
.tag-info { background: #f4f4f5; color: #909399; border: 1px solid #e9e9eb; }
.pagination { display: flex; align-items: center; justify-content: flex-end; padding: 14px 20px; gap: 6px; font-size: 13px; color: #606266; }
.page-btn { min-width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 1px solid #e4e7ed; border-radius: 4px; background: #fff; }
.page-btn.active { background: #207FE9; color: #fff; }
.page-btn.disabled { opacity: 0.4; }
</style>
</head>
<body>
<div class="page">
  <div class="page-title">满返活动</div>
  <div class="card">
    <div class="card-body">
      <div class="search-bar">
        <input type="text" placeholder="请输入活动名称">
        <select><option>全部</option><option>待审核</option><option>进行中</option><option>已结束</option></select>
        <input type="text" placeholder="开始日期" style="width:120px;"> - <input type="text" placeholder="结束日期" style="width:120px;">
        <button class="btn">🔍 搜索</button>
        <button class="btn btn-default">重置</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>活动ID</th><th>活动名称</th><th>活动类型</th><th>适用范围</th><th>开始时间</th><th>结束时间</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>PM001</td><td>618年中大促满返</td><td>满返活动</td><td>全品类</td><td>2025-06-01</td><td>2025-06-18</td><td><span class="tag tag-success">进行中</span></td><td><a href="#">详情</a> <a href="#" style="color:#f56c6c;">结束</a></td></tr>
            <tr><td>PM002</td><td>新品上市满减</td><td>满减活动</td><td>空调/冰箱</td><td>2025-06-10</td><td>2025-06-30</td><td><span class="tag tag-success">进行中</span></td><td><a href="#">详情</a> <a href="#" style="color:#f56c6c;">结束</a></td></tr>
            <tr><td>PM003</td><td>端午特惠满赠</td><td>满赠活动</td><td>厨房电器</td><td>2025-05-28</td><td>2025-06-05</td><td><span class="tag tag-info">已结束</span></td><td><a href="#">详情</a></td></tr>
          </tbody>
        </table>
        <div class="pagination"><span>共 3 条</span><span class="page-btn disabled">&lt;</span><span class="page-btn active">1</span><span class="page-btn disabled">&gt;</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
